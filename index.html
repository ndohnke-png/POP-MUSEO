<!DOCTYPE html>
<html>
  <head>
    <title>Ariana Grande XR Museum - Perfect View</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://unpkg.com/super-hands@3.0.4/dist/super-hands.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
  </head>
  <body>
    <a-scene physics="driver: local; gravity: 0; debug: false">
      
      <a-assets>
        <!-- Tu modelo 3D registrado -->
        <a-asset-item id="disco-tun" src="thank u, next.glb"></a-asset-item>
      </a-assets>
      
      <!-- EL FONDO Y EL PISO -->
      <a-sky color="#0a0512"></a-sky>
      <a-plane static-body position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#111116"></a-plane>

      <!-- LUCES (Volvemos al rosa potente e iluminamos el cartel) -->
      <a-light type="ambient" color="#3c1053" intensity="1.5"></a-light>
      <a-light type="point" color="#ff007f" intensity="2.5" position="0 3.5 -3"></a-light>

      <!-- CARTEL DE BIENVENIDA (Centrado y justo arriba de la mesa) -->
      <a-text value="ARIANA GRANDE MUSEUM" position="0 3 -3.5" align="center" color="#ffffff" width="6"></a-text>
      <a-text value="Dangerous Woman Era" position="0 2.6 -3.5" align="center" color="#ff007f" width="4"></a-text>

      <!-- MESA CENTRAL (Justo adelante tuyo al arrancar) -->
      <a-box static-body position="0 0.5 -3.5" width="2" height="0.6" depth="1" color="#1c1c24"></a-box>

      <!-- ASSET INTERACTIVO: Tu vinilo apoyado en la mesa -->
      <a-gltf-model src="#disco-tun" 
                    position="0 0.9 -3.5" 
                    scale="1 1 1"
                    grabbable
                    dynamic-body="mass: 1"
                    id="vinilo-interactivo">
      </a-gltf-model>

      <!-- JUGADOR COMPLETAMENTE REPOSICIONADO -->
      <!-- 'position="0 0 0"' te ubica justo en el centro del escenario, de frente a la mesa que está a -3.5 en el eje Z -->
      <a-entity id="rig" position="0 0 0" movement-controls="controls: gamepad, keyboard; speed: 0.15">
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
        
        <!-- Controles de Meta Quest -->
        <a-entity id="leftHand" laser-controls="hand: left" super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"></a-entity>
        <a-entity id="rightHand" laser-controls="hand: right" super-hands="colliderEvent: raycaster-intersection; colliderEventProperty: els; colliderEndEvent: raycaster-intersection-cleared; colliderEndEventProperty: clearedEls"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
