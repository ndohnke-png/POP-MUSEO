<!DOCTYPE html>
<html>
  <head>
    <title>Ariana Grande XR Museum - Hard Reset</title>
    <!-- Cargamos UNICAMENTE la librería base de A-Frame, sin ningún agregado raro -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    
    <a-scene>
      
      <a-assets>
        <!-- Tu modelo 3D registrado -->
        <a-asset-item id="disco-tun" src="thank u, next.glb"></a-asset-item>
      </a-assets>
      
      <!-- EL FONDO Y EL PISO -->
      <a-sky color="#0a0512"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#111116"></a-plane>

      <!-- LUCES -->
      <a-light type="ambient" color="#3c1053" intensity="1.5"></a-light>
      <a-light type="point" color="#ff007f" intensity="2.5" position="0 3.5 -3"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="0 3 1"></a-light>

      <!-- CARTEL DE BIENVENIDA -->
      <a-text value="ARIANA GRANDE MUSEUM" position="0 3 -3.5" align="center" color="#ffffff" width="6"></a-text>
      <a-text value="Dangerous Woman Era" position="0 2.6 -3.5" align="center" color="#ff007f" width="4"></a-text>

      <!-- MESA CENTRAL -->
      <a-box position="0 0.5 -3.5" width="2" height="0.6" depth="1" color="#1c1c24"></a-box>

      <!-- ASSET: Tu modelo 3D totalmente fijo -->
      <a-gltf-model src="#disco-tun" 
                    position="0 0.9 -3.5" 
                    scale="1 1 1"
                    id="vinilo-interactivo">
      </a-gltf-model>

      <!-- CÁMARA ULTRA BÁSICA RESETEADA -->
      <!-- Sin scripts externos. Se mueve con WASD / Flechas y el mouse haciendo arrastre normal -->
      <a-camera position="0 1.6 0"></a-camera>

    </a-scene>
  </body>
</html>
