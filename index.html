<!DOCTYPE html>
<html>
  <head>
    <title>Ariana Grande XR Museum - Stable</title>
    <!-- Cargamos solo lo necesario para ver y caminar, sin físicas rotas -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <!-- Quitamos el componente physics de la escena -->
    <a-scene>
      
      <a-assets>
        <!-- Tu modelo 3D registrado -->
        <a-asset-item id="disco-tun" src="thank u, next.glb"></a-asset-item>
      </a-assets>
      
      <!-- EL FONDO Y EL PISO -->
      <a-sky color="#0a0512"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#111116"></a-plane>

      <!-- LUCES (Rosa potente e iluminando el frente) -->
      <a-light type="ambient" color="#3c1053" intensity="1.5"></a-light>
      <a-light type="point" color="#ff007f" intensity="2.5" position="0 3.5 -3"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.8" position="0 3 1"></a-light>

      <!-- CARTEL DE BIENVENIDA -->
      <a-text value="ARIANA GRANDE MUSEUM" position="0 3 -3.5" align="center" color="#ffffff" width="6"></a-text>
      <a-text value="Dangerous Woman Era" position="0 2.6 -3.5" align="center" color="#ff007f" width="4"></a-text>

      <!-- MESA CENTRAL (Fija, no se va a mover a ningún lado) -->
      <a-box position="0 0.5 -3.5" width="2" height="0.6" depth="1" color="#1c1c24"></a-box>

      <!-- ASSET: Tu modelo 3D flotando quieto arriba de la mesa -->
      <!-- Le dejamos la animación de rotación para que quede fachero en exposición -->
      <a-gltf-model src="#disco-tun" 
                    position="0 0.9 -3.5" 
                    scale="1 1 1"
                    id="vinilo-interactivo"
                    animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
      </a-gltf-model>

      <!-- JUGADOR: Mantiene la caminata con joysticks para Meta Quest -->
      <a-entity id="rig" position="0 0 0" movement-controls="controls: gamepad, keyboard; speed: 0.15">
        <a-entity camera position="0 1.6 0" look-controls></a-entity>
        <!-- Controles visuales de las manos -->
        <a-entity laser-controls="hand: left"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
